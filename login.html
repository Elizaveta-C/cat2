<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница авторизации</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .switch-link {
            text-align: center;
            margin-top: 15px;
        }
        .switch-link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Вход в систему</h2>
        <!-- ИЗМЕНЕНО: id="login-form" вместо id="76" -->
        <form id="login-form" method="post">
            <div class="form-group">
                <label for="username">Логин или Email</label>
                <input type="text" id="username" name="username" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <div class="switch-link">
            <a href="/">Зарегистрироваться</a>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ JQUERY -->
    <script src="https://jquery.com"></script>

    <!-- ВСТАВЛЯЕМ НАШ СКИПТ -->
    <script>
    $(document).ready(function(){
        $('#login-form').on('submit', function(e){
            e.preventDefault(); 
            
            $.ajax({
                url: '/user_login', 
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    email: $('#username').val(), 
                    password: $('#password').val()
                })
            })
            .done(function(data){
                if (data.result){
                    alert('Вы успешно вошли!');
                    window.location.href = '/dashboard'; 
                } else {
                    alert(data.error || 'Неверный логин или пароль');
                }
            })
            .fail(function(){
                alert('Ошибка сервера при авторизации');
            });
        });
    });
    </script>
</body>
</html>
